<!DOCTYPE html>
<html>
<head>
    <title>Register Donor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="left-side">
    <div class="overlay">
      <span class="badge">DONOR REGISTRATION PORTAL</span>
      <h1>Save Lives.<br>Donate Blood.</h1>
      <p>Join thousands of donors helping patients in emergency situations.
         Your one donation can save up to 3 lives.</p>
      <div class="stats">
        <div class="stat"><h3>4.5M+</h3><p>Lives Saved</p></div>
        <div class="stat"><h3>120K+</h3><p>Active Donors</p></div>
        <div class="stat"><h3>850+</h3><p>Blood Banks</p></div>
      </div>
    </div>
  </div>

  <div class="right-side">
    <div class="form-container">
      <h2>Donor Registration</h2>
      <p class="form-subtitle">Fill in your details to become a donor</p>

      <form id="registerForm">

        <input type="text" id="name" placeholder="Full Name" required>
        <input type="number" id="age" placeholder="Age" required>

        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>

        <select id="bloodGroup" required>
          <option value="">Select Blood Group</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>

        <input type="text" id="contact" placeholder="Contact Number" required>
        <input type="email" id="email" placeholder="Email Address" required>

        <select id="state" required>
          <option value="">Select State</option>
        </select>

        <select id="city" required>
          <option value="">Select City</option>
        </select>

        <button type="submit">Save a Life ❤️</button>

        <p id="message"></p>

      </form>
    </div>
  </div>

<script src="{{ url_for('static', filename='register.js') }}"></script>
</body>
</html>
